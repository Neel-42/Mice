name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages (main /docs)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = { branch: "main", path: "/docs" };
            try {
              await github.request("POST /repos/{owner}/{repo}/pages", {
                owner,
                repo,
                build_type: "legacy",
                source,
              });
              core.info("Created GitHub Pages site from main/docs");
            } catch (err) {
              if (err.status === 409) {
                await github.request("PUT /repos/{owner}/{repo}/pages", {
                  owner,
                  repo,
                  build_type: "legacy",
                  source,
                });
                core.info("Updated GitHub Pages site to main/docs");
              } else {
                core.warning(`Pages API: ${err.message}`);
              }
            }
